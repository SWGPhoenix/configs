# Phoenix-managed bazaar resource stockpile. The Linux localOptions.cfg
# enables this for the Phoenix server; leave false for other deployments.
enableBazaarResourceStockpile=false
bazaarResourceStockpileStacks=5
bazaarResourceStockpileUnitsPerStack=10000
bazaarResourceStockpileCreditsPerUnit=1
# Meat, bone and hide in the stockpile; players can sell these to the bazaar.
bazaarResourceStockpileCreatureCreditsPerUnit=2
bazaarResourceStockpileRefreshSeconds=3600

# Phoenix: bazaar terminals buy meat, bone and hide for credits paid at once
# (radial "Sell Creature Resources"). Enabled in the Linux localOptions.cfg.
enableBazaarCreatureResourceSale=false
bazaarCreatureResourceSaleCreditsPerUnit=1

# Phoenix: express travel. A starport's ticket collector and terminal open the travel
# map; once the fare is paid the traveller leaves at once, with no ticket and no
# shuttle wait. Pets and vehicles are put away for the trip. On unless set to false.
phoenixExpressTravel=true

